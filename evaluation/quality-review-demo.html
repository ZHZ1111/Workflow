['review','审查发现：缺少恰好 100 的边界','审查仅引用规格提出补充，不能改写已通过断言。',`规格：${finding.spec_quote}\n发现：${finding.description}\n建议：${finding.suggested_case}`],
['generation','第 2 轮：消费反馈并追加测试','第一轮质量反馈由第二轮生成节点消费，原测试保持不变。',data.test_diff+`\n消费证据：${data.feedback.message_id}\n来源第 ${data.feedback.source_round} 轮 → 消费第 ${data.feedback.consumer_round} 轮`],
['execution','第 2 轮：重新真实执行','3 个测试全部通过；新候选必须重新执行，不能沿用上一轮观察。',JSON.stringify({execution:second.execution.kind,passed:second.execution.passed,line:second.coverage.line_percent,branch:second.coverage.branch_percent},null,2)],
['review','审查批准当前候选，导出第 2 轮','质量批准与本轮规格、候选和执行证据绑定。',`决定：${second.quality.assessment.decision.verdict}\n选中轮次：${data.selected_round}\n最终测试 SHA-256：${data.final_test_sha256}`]
];
let elapsed=0,timer=null,start=0,index=0;
function render(i){index=i;const [role,title,explain,evidence]=stages[i];for(const id of ['generation','execution','review'])$(id).classList.toggle('active',id===role);$('step').textContent=`录制片段 ${i+1} / 6`;$('title').textContent=title;$('explain').textContent=explain;$('evidence').textContent=evidence;$('metrics').textContent=`实际 pytest ${data.pytest_processes} 次 · 模型请求 ${data.external_requests} 次 · 最终选中第 ${data.selected_round} 轮`}
function stop(){clearInterval(timer);timer=null}
function tick(){elapsed=Math.min(45,(performance.now()-start)/1000);$('clock').textContent=`${Math.floor(elapsed)} / 45 秒`;$('bar').style.width=`${elapsed/45*100}%`;render(Math.min(5,Math.floor(elapsed/7.5)));if(elapsed>=45)stop()}
$('play').onclick=()=>{stop();elapsed=0;start=performance.now();tick();timer=setInterval(tick,200)};
$('pause').onclick=()=>{if(timer)stop();else{start=performance.now()-elapsed*1000;timer=setInterval(tick,200)}};
$('next').onclick=()=>{stop();render((index+1)%6)};
$('provenance').textContent=`任务 ${data.run_id} · 录制于 ${data.recorded_at} · 实际任务耗时 ${data.duration_seconds.toFixed(2)} 秒 · ${data.run_dir}`;
if(data.report_href){$('report').href=data.report_href}else{$('report').hidden=true}render(0);
</script></html>
