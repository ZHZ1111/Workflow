[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "test-workflow"
version = "0.1.0"
description = "A synchronous multi-agent testing workflow built on AgentDev"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "pytest==9.1.1",
    "coverage==7.16.1",
]

[project.scripts]
test-workflow = "test_workflow.cli:main"
test-workflow-web = "test_workflow.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"test_workflow.demo" = ["data/*.json", "data/*.py", "data/*.md"]
"test_workflow" = ["web_static/*.html", "web_static/*.css", "web_static/*.js"]
"test_workflow.agents.test_generation.core" = ["web_static/*.html", "web_static/*.css", "web_static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
